name: filisenti_app
description: "Sentiment analysis for Tagalog and Hiligaynon using FiliSenti ONNX model."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.8.3
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tokenizer/tokenizer.json
    - assets/images/
